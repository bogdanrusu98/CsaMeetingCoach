name: Deploy demo VM

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      operation:
        description: Select deployment or one-time reviewed knowledge indexing
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - index-knowledge

permissions:
  contents: read

concurrency:
  group: csa-meeting-coach-demo
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  DEMO_HOSTNAME: csa-meeting-coach-demo.westus2.cloudapp.azure.com
  COACH_AGENT_PROVIDER: ${{ vars.COACH_AGENT_PROVIDER || 'Local' }}
  FOUNDRY_PROJECT_ENDPOINT: https://csa-meeting-coach-resource.services.ai.azure.com/api/projects/csa-meeting-coach
  FOUNDRY_MODEL_DEPLOYMENT: gpt-4.1-mini
  FOUNDRY_AGENT_NAME: csa-meeting-coach-v5
  FOUNDRY_VECTOR_STORE_IDS: ${{ vars.FOUNDRY_VECTOR_STORE_IDS }}
  BROWSER_SPEECH_ENABLED: ${{ vars.BROWSER_SPEECH_ENABLED || 'false' }}
  BROWSER_SPEECH_ACCESS_KEY: ${{ secrets.BROWSER_SPEECH_ACCESS_KEY }}
  BROWSER_SPEECH_ENDPOINT_ID: ${{ vars.BROWSER_SPEECH_ENDPOINT_ID }}
  TRANSCRIPT_ADAPTER_AUTH_MODE: ${{ vars.TRANSCRIPT_ADAPTER_AUTH_MODE || 'Disabled' }}
  TRANSCRIPT_ADAPTER_API_KEY: ${{ secrets.TRANSCRIPT_ADAPTER_API_KEY }}
  TRANSCRIPT_ADAPTER_ENTRA_TENANT_ID: ${{ vars.TRANSCRIPT_ADAPTER_ENTRA_TENANT_ID }}
  TRANSCRIPT_ADAPTER_ENTRA_AUDIENCE: ${{ vars.TRANSCRIPT_ADAPTER_ENTRA_AUDIENCE }}
  MEDIA_BOT_ENABLED: ${{ vars.MEDIA_BOT_ENABLED || 'false' }}
  MEDIA_BOT_GRAPH_TENANT_ID: ${{ vars.MEDIA_BOT_GRAPH_TENANT_ID }}
  MEDIA_BOT_GRAPH_APP_ID: ${{ vars.MEDIA_BOT_GRAPH_APP_ID }}
  MEDIA_BOT_GRAPH_CLIENT_SECRET: ${{ secrets.MEDIA_BOT_GRAPH_CLIENT_SECRET }}
  MEDIA_BOT_PUBLIC_IP: ${{ vars.MEDIA_BOT_PUBLIC_IP }}
  MEDIA_BOT_CERTIFICATE_THUMBPRINT: ${{ vars.MEDIA_BOT_CERTIFICATE_THUMBPRINT }}
  MEDIA_BOT_SPEECH_KEY: ${{ secrets.MEDIA_BOT_SPEECH_KEY }}
  MEDIA_BOT_SPEECH_REGION: ${{ vars.MEDIA_BOT_SPEECH_REGION }}
  MEDIA_BOT_SPEECH_LANGUAGE: ${{ vars.MEDIA_BOT_SPEECH_LANGUAGE || 'en-US' }}
  MEDIA_BOT_COACH_AUTH_MODE: ${{ vars.MEDIA_BOT_COACH_AUTH_MODE || 'Disabled' }}
  MEDIA_BOT_COACH_ENTRA_SCOPE: ${{ vars.MEDIA_BOT_COACH_ENTRA_SCOPE }}
  MEDIA_BOT_CONTROL_AUTH_MODE: ${{ vars.MEDIA_BOT_CONTROL_AUTH_MODE || 'Disabled' }}
  MEDIA_BOT_CONTROL_API_KEY: ${{ secrets.MEDIA_BOT_CONTROL_API_KEY }}
  MEDIA_BOT_CONTROL_ENTRA_TENANT_ID: ${{ vars.MEDIA_BOT_CONTROL_ENTRA_TENANT_ID }}
  MEDIA_BOT_CONTROL_ENTRA_AUDIENCE: ${{ vars.MEDIA_BOT_CONTROL_ENTRA_AUDIENCE }}

jobs:
  index-knowledge:
    name: Index reviewed knowledge
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'index-knowledge' }}
    runs-on:
      - self-hosted
      - Windows
      - X64
      - csa-demo
    timeout-minutes: 20
    outputs:
      vector-store-id: ${{ steps.index.outputs.vector_store_id }}

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 8.0.423

      - name: Restore indexer
        shell: powershell
        run: dotnet restore .\tools\CsaMeetingCoach.KnowledgeIndexer\CsaMeetingCoach.KnowledgeIndexer.csproj

      - name: Build indexer
        shell: powershell
        run: dotnet build .\tools\CsaMeetingCoach.KnowledgeIndexer\CsaMeetingCoach.KnowledgeIndexer.csproj -c Release --no-restore

      - name: Create reviewed vector store
        id: index
        shell: powershell
        run: |
          $diagnosticsPath = "$env:RUNNER_TEMP\knowledge-indexer-diagnostics.txt"
          $previousErrorActionPreference = $ErrorActionPreference
          try {
            # Windows PowerShell 5.1 wraps native stderr as error records.
            $ErrorActionPreference = "Continue"
            $output = & dotnet run `
              --project .\tools\CsaMeetingCoach.KnowledgeIndexer `
              -c Release `
              --no-build `
              --no-restore `
              -- `
              --project-endpoint $env:FOUNDRY_PROJECT_ENDPOINT `
              --source-directory .\knowledge `
              --store-name "CSA Meeting Coach Knowledge" `
              2> $diagnosticsPath
            $indexerExitCode = $LASTEXITCODE
          }
          finally {
            $ErrorActionPreference = $previousErrorActionPreference
          }
          if ($indexerExitCode -ne 0) {
            Get-Content $diagnosticsPath
            throw "Knowledge indexing failed."
          }

          $vectorStoreId = ($output | Out-String).Trim()
          if ($vectorStoreId -notmatch "^vs_[A-Za-z0-9]{1,125}$") {
            throw "Knowledge indexer did not return one valid vector store ID."
          }

          "vector_store_id=$vectorStoreId" >> $env:GITHUB_OUTPUT
          Write-Output "VECTOR_STORE_ID=$vectorStoreId"
          "Created reviewed vector store: ``$vectorStoreId``" >> $env:GITHUB_STEP_SUMMARY

  validate-and-deploy:
    name: Validate and deploy
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy') || (github.event_name == 'push' && (vars.COACH_AGENT_PROVIDER != 'Foundry' || vars.FOUNDRY_VECTOR_STORE_IDS != '')) }}
    runs-on:
      - self-hosted
      - Windows
      - X64
      - csa-demo
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 8.0.423

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: src/CsaMeetingCoach.Web/package-lock.json
          registry-url: https://packagefeedproxy.microsoft.io/npm/

      - name: Build React Toastify UI
        shell: powershell
        working-directory: .\src\CsaMeetingCoach.Web
        env:
          NPM_CONFIG_REGISTRY: https://packagefeedproxy.microsoft.io/npm/
        run: |
          $registry = (npm config get registry).TrimEnd("/")
          if ($registry -ne "https://packagefeedproxy.microsoft.io/npm") {
            throw "npm registry must use the Microsoft CFS feed."
          }
          npm run validate:supply-chain --ignore-scripts
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build --ignore-scripts

      - name: Restore
        shell: powershell
        run: dotnet restore .\CsaMeetingCoach.sln

      - name: Build
        shell: powershell
        run: dotnet build .\CsaMeetingCoach.sln -c Release --no-restore

      - name: Test
        shell: powershell
        run: dotnet test .\CsaMeetingCoach.sln -c Release --no-build

      - name: Publish Windows service
        shell: powershell
        run: |
          $publishDirectory = "$env:RUNNER_TEMP\csa-meeting-coach-publish"
          $botPublishDirectory = "$env:RUNNER_TEMP\csa-meeting-coach-bot-publish"
          $pdfPublishDirectory = "$env:RUNNER_TEMP\csa-meeting-coach-pdf-publish"
          Remove-Item $publishDirectory -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $botPublishDirectory -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $pdfPublishDirectory -Recurse -Force -ErrorAction SilentlyContinue
          dotnet publish .\src\CsaMeetingCoach.Api\CsaMeetingCoach.Api.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -o $publishDirectory
          dotnet publish .\src\CsaMeetingCoach.BotService\CsaMeetingCoach.BotService.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -o $botPublishDirectory
          dotnet publish .\src\CsaMeetingCoach.PdfExtractor\CsaMeetingCoach.PdfExtractor.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:DebugType=None `
            -o $pdfPublishDirectory
          Copy-Item `
            -Path "$pdfPublishDirectory\CsaMeetingCoach.PdfExtractor.exe" `
            -Destination $publishDirectory

      - name: Deploy with local rollback
        shell: powershell
        run: |
          $disabledBotParameters = @{
            PublishDirectory = "$env:RUNNER_TEMP\csa-meeting-coach-bot-publish"
            Hostname = $env:DEMO_HOSTNAME
          }
          .\deploy\Deploy-MediaBot.ps1 @disabledBotParameters

          $apiParameters = @{
            PublishDirectory = "$env:RUNNER_TEMP\csa-meeting-coach-publish"
            Hostname = $env:DEMO_HOSTNAME
            CoachAgentProvider = $env:COACH_AGENT_PROVIDER
            FoundryProjectEndpoint = $env:FOUNDRY_PROJECT_ENDPOINT
            FoundryModelDeployment = $env:FOUNDRY_MODEL_DEPLOYMENT
            FoundryAgentName = $env:FOUNDRY_AGENT_NAME
            FoundryVectorStoreIds = $env:FOUNDRY_VECTOR_STORE_IDS
            BrowserSpeechEnabled = $env:BROWSER_SPEECH_ENABLED -eq "true"
            BrowserSpeechSubscriptionKey = $env:MEDIA_BOT_SPEECH_KEY
            BrowserSpeechAccessKey = $env:BROWSER_SPEECH_ACCESS_KEY
            BrowserSpeechRegion = $env:MEDIA_BOT_SPEECH_REGION
            BrowserSpeechLanguage = $env:MEDIA_BOT_SPEECH_LANGUAGE
            BrowserSpeechEndpointId = $env:BROWSER_SPEECH_ENDPOINT_ID
            TranscriptAdapterAuthenticationMode = $env:TRANSCRIPT_ADAPTER_AUTH_MODE
            TranscriptAdapterDevelopmentApiKey = $env:TRANSCRIPT_ADAPTER_API_KEY
            TranscriptAdapterEntraTenantId = $env:TRANSCRIPT_ADAPTER_ENTRA_TENANT_ID
            TranscriptAdapterEntraAudience = $env:TRANSCRIPT_ADAPTER_ENTRA_AUDIENCE
          }
          .\deploy\Deploy-Demo.ps1 @apiParameters

          if ($env:MEDIA_BOT_ENABLED -ne "true") {
            return
          }

          $botParameters = @{
            PublishDirectory = "$env:RUNNER_TEMP\csa-meeting-coach-bot-publish"
            Hostname = $env:DEMO_HOSTNAME
            Enabled = $true
            GraphTenantId = $env:MEDIA_BOT_GRAPH_TENANT_ID
            GraphAppId = $env:MEDIA_BOT_GRAPH_APP_ID
            GraphClientSecret = $env:MEDIA_BOT_GRAPH_CLIENT_SECRET
            PublicIpAddress = $env:MEDIA_BOT_PUBLIC_IP
            CertificateThumbprint = $env:MEDIA_BOT_CERTIFICATE_THUMBPRINT
            SpeechSubscriptionKey = $env:MEDIA_BOT_SPEECH_KEY
            SpeechRegion = $env:MEDIA_BOT_SPEECH_REGION
            SpeechLanguage = $env:MEDIA_BOT_SPEECH_LANGUAGE
            CoachApiAuthenticationMode = $env:MEDIA_BOT_COACH_AUTH_MODE
            CoachApiDevelopmentApiKey = $env:TRANSCRIPT_ADAPTER_API_KEY
            CoachApiEntraScope = $env:MEDIA_BOT_COACH_ENTRA_SCOPE
            TranscriptAdapterAuthenticationMode = $env:TRANSCRIPT_ADAPTER_AUTH_MODE
            TranscriptAdapterEntraTenantId = $env:TRANSCRIPT_ADAPTER_ENTRA_TENANT_ID
            TranscriptAdapterEntraAudience = $env:TRANSCRIPT_ADAPTER_ENTRA_AUDIENCE
            ControlAuthenticationMode = $env:MEDIA_BOT_CONTROL_AUTH_MODE
            ControlDevelopmentApiKey = $env:MEDIA_BOT_CONTROL_API_KEY
            ControlEntraTenantId = $env:MEDIA_BOT_CONTROL_ENTRA_TENANT_ID
            ControlEntraAudience = $env:MEDIA_BOT_CONTROL_ENTRA_AUDIENCE
          }
          .\deploy\Deploy-MediaBot.ps1 @botParameters

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Configure CSA Meeting Coach</title>
  <script>
    (() => {
      const param = new URLSearchParams(window.location.search).get("scoutTheme");
      const theme =
        param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <link rel="stylesheet" href="styles.css?v=20260810b">
</head>
<body>
  <main class="info-shell">
    <section class="info-card">
      <p class="eyebrow">Meeting side panel</p>
      <h1>CSA Meeting Coach</h1>
      <p>
        Add the private checklist and task coach to this meeting. The organizer
        remains responsible for participant notice and approved transcription.
      </p>
      <aside id="configuration-status" class="info-note">
        Initializing Microsoft Teams…
      </aside>
    </section>
  </main>
  <script src="https://res.cdn.office.net/teams-js/2.31.0/js/MicrosoftTeams.min.js"></script>
  <script src="configure.js?v=20260801d"></script>
</body>
</html>
